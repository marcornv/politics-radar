# Radar Legislativo with a local AI, no Node or Python needed: `docker compose up`, then open http://localhost:3000.
# The first start downloads the Ollama model (about 5 GB for the default); summaries work once it finishes.
# To use Anthropic, OpenAI or Groq instead, paste a key in Configurações; a key saved there wins over Ollama.
# Other models: OLLAMA_MODEL=qwen2.5:3b (summaries) or EMBEDDING_MODEL=qwen3-embedding:4b (agenda) docker compose up -d

services:
  radar:
    build: .
    init: true
    ports:
      # Only this computer. Settings can only be changed from localhost, and anyone who reaches the
      # site can spend your AI credits. Use "3000:3000" to open it to your network at your own risk.
      - "127.0.0.1:3000:3000"
    environment:
      COMPATIVEL_URL: http://ollama:11434/v1
      COMPATIVEL_MODELO: ${OLLAMA_MODEL:-llama3.1:8b}
      # Embedding model that orders the upcoming agenda for the reader, on request ("Para você" in Votações → Previstas).
      # The 4b is a little more accurate but ~6x slower and ~3.4 GB of RAM on CPU; worth it with a GPU.
      EMBEDDING_URL: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
    volumes:
      - config:/app/.config
      - cache:/app/.cache
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.11
    # Not published to the host: only the Radar talks to it, over the compose network.
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    # NVIDIA GPU (needs the NVIDIA Container Toolkit). Without it Ollama runs on the CPU, which is slow.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Downloads the models once, then exits. Later starts find it in the volume and finish right away.
  ollama-modelo:
    image: ollama/ollama:0.40.11
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c", "ollama pull ${OLLAMA_MODEL:-llama3.1:8b} && ollama pull ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  config:
  cache:
  ollama:
